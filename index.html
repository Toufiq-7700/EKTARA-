<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursive Garden</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <!-- Welcome screen -->
  <div id="welcome-screen" class="welcome-screen">
    <div class="welcome-content">
      <h1 class="welcome-title">🌳 Recursive Garden</h1>
      <p class="welcome-subtitle">
        Four recursive algorithms weave melody, rhythm, bass, and visuals
        into a living, breathing garden. Put on headphones for the best experience.
      </p>
      <button id="begin-btn" class="begin-btn" aria-label="Begin the experience">
        Begin
      </button>
      <p class="welcome-hint">🎧 Headphones recommended</p>
    </div>
  </div>

  <!-- Top View Switcher (Garden / Split / Lab) -->
  <nav id="view-switcher" class="view-switcher" aria-label="Workspace view" style="display:none;">
    <button class="view-tab active" data-view="garden" aria-pressed="true">🌳 Garden</button>
    <button class="view-tab split-only" data-view="split" aria-pressed="false">◫ Split</button>
    <button class="view-tab" data-view="lab" aria-pressed="false">🔬 Lab</button>
  </nav>

  <!-- Workspace: Garden stage + Algorithm Lab -->
  <div id="workspace-layout" class="workspace-layout view-garden" style="display:none;">
    <div id="garden-stage" class="garden-stage">
      <canvas id="garden-canvas" class="garden-canvas"></canvas>
    </div>
    <section id="lab-panel" class="lab-panel" aria-label="Algorithm Lab" style="display:none;"></section>
  </div>

  <!-- UI overlay container (hidden until Begin is clicked) -->
  <div id="ui-overlay" style="display:none;"></div>

  <!-- Non-intrusive audio/status banner -->
  <div id="status-banner" class="status-banner" role="alert" style="display:none;">
    <span id="status-message"></span>
    <button id="status-action" class="status-action" style="display:none;">Retry Audio</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
